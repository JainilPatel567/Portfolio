<body>
   <h2>Contact Us</h2>
   <form action="/action_page.php" method="POST" >
      
       <p>
           <label for="full-name">Full Name:</label><br>
           <input type="text" id="full-name" name="user_name" value="Your Name">
       </p>

       <p>
           <label for="email">Email Address:</label><br>
           <input type="text" id="email" name="user_email" value="name@example.com">
       </p>

       <p>
           <label for="phone">Phone Number:</label><br>
           <input type="text" id="phone" name="user_phone" value="123-456-7890">
       </p>

       <p>
           <label for="subject">Subject:</label><br>
           <input type="radio" id="general" name="subject" value="general">
           <label for="general">General Inquiry</label><br>
           <input type="radio" id="support" name="subject" value="support">
           <label for="support">Technical Support</label><br>
           <input type="radio" id="billing" name="subject" value="billing">
           <label for="billing">Billing Question</label><br>
       </p>

       <p>
           <label for="time_pref">Best time to reach you:</label><br>
           <input type="radio" id="morning" name="time_pref" value="morning">
           <label for="morning">Morning</label><br>
           <input type="radio" id="afternoon" name="time_pref" value="afternoon">
           <label for="afternoon">Afternoon</label><br>
       </p>

       <p>
           <label for="attachment">Attach a file (Screenshots, etc.):</label><br>
           <input type="file" value="File">
       </p>

       <p>
           <label for="message">Message:</label><br>
           <input type="text" id="message" name="user_message" value="How can we help?">
       </p>

       <button type="submit">Send Message</button>

   </form>
